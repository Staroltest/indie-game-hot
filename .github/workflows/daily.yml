name: IndieHOT update

# 每 4 小时一轮：拉取 -> 评分 -> 生成 -> 直接提交回仓库。
# 每天早上 06:00（北京时间，UTC 22:00）那轮额外产出当日日报。
# 公开库的 Actions 分钟数不限，跑在 GitHub 的服务器上，不需要常驻服务器或数据库。

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:
    inputs:
      daily:
        description: "同时产出当日日报"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: indiehot-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate
        run: |
          ARGS=""
          if [ "${{ inputs.daily }}" = "true" ] || [ "$(date -u +%H)" = "22" ]; then
            ARGS="--daily"
          fi
          echo "generator args: $ARGS"
          python3 tools/generate.py $ARGS

      - name: Commit updates
        run: |
          git config user.name "IndieHOT Bot"
          git config user.email "indiehot-bot@users.noreply.github.com"
          git add data index.html daily.html
          git diff --cached --quiet || git commit -m "chore: update $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
